<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101616">
    <title>Artwork — Student Art Archive</title>
    <link rel="stylesheet" href="/artwork-app.css">
    <script src="/artwork-view.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">STUDENT ART <span>ARCHIVE</span></a>
      <nav aria-label="Main navigation">
        <a href="/index.html">Gallery</a>
        <a href="/upload.html">Add artwork</a>
      </nav>
    </header>
    <main class="page-wrap">
      <p class="eyebrow">DIGITAL ARTWORK RECORD</p>
      <p id="artwork-status" class="status-message" role="status" aria-live="polite">Loading artwork…</p>
      <article id="artwork-detail" class="artwork-detail" hidden>
        <div class="detail-image-wrap"><img id="detail-image" alt=""></div>
        <div class="detail-copy">
          <p id="detail-id" class="eyebrow"></p>
          <h1 id="detail-title"></h1>
          <p id="detail-description" class="detail-description"></p>
          <a class="text-link" href="/index.html">Explore the gallery ↗</a>
        </div>
      </article>
      <a id="back-to-gallery" class="button button-secondary" href="/index.html" hidden>Back to gallery</a>
    </main>
    <footer><span>STUDENT ART ARCHIVE</span><a href="/upload.html">Contribute a work ↗</a></footer>
  </body>
</html>
